name: Update Streak Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats-action@v2
        with:
          user: ssuptina
          theme: dark
          hide_border: 'false'
          border_radius: '5'
          output_file: assets/streak-stats.svg # Saves image inside your repo

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update streak stats svg"
          file_pattern: "assets/streak-stats.svg"
